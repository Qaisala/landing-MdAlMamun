<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/index.css" rel="stylesheet" />
    <title>Landing-MdAlMamun</title>
  </head>

  <body>
    <!-- <div id="root"></div> -->

    <!-- Header Section -->
    <header>
      <nav
        class="container max-w-360 px-4 py-4 flex items-center justify-between"
      >
        <!-- logo -->
        <a href="/">
          <div class="text-2xl font-bold flex items-center gap-2">
            <img src="/src/images/logo.png" alt="logo" class="h-8" />
            <span class="text-primary">LaslesVPN</span>
          </div>
        </a>

        <!-- menu items -->
        <ul class="hidden md:flex space-x-8">
          <li>
            <a href="#about" class="text-gray-600 hover:text-primary">About</a>
          </li>
          <li>
            <a href="#features" class="text-gray-600 hover:text-primary"
              >Features</a
            >
          </li>
          <li>
            <a href="#pricing" class="text-gray-600 hover:text-primary"
              >Pricing</a
            >
          </li>
          <li>
            <a href="#testimonials" class="text-gray-600 hover:text-primary"
              >Testimonials</a
            >
          </li>
          <li>
            <a href="#subscribe" class="text-gray-600 hover:text-primary"
              >Subscribe</a
            >
          </li>
        </ul>

        <!-- authentication buttons -->
        <div class="space-x-4">
          <button
            class="text-gray-600 hover:text-primary cursor-pointer hidden sm:inline-flex"
          >
            Sign In
          </button>
          <button
            class="bg-primary text-white hover:bg-red-600 px-4 py-2 rounded-full cursor-pointer"
          >
            Sign Up
          </button>
        </div>
      </nav>
    </header>

    <!-- Hero Section -->
    <section
      class="container max-w-360 mx-auto px-4 py-28 flex flex-col items-center gap-12 md:flex-row"
    >
      <!-- left side -->
      <div class="md:w-1/2 mb-8 md:mb-0 space-y-8">
        <h1
          class="text-4xl md:text-5xl lg:text-6xl font-bold text-heading-text leading-tight"
        >
          Want anything to be easy with LaslesVPN..
        </h1>
        <p class="text-primary-text text-lg leading-relaxed max-w-xl">
          Provide a network for all your needs with ease and fun using LaslesVPN
          discover interesting features from us.
        </p>
        <button
          class="bg-primary text-white px-12 py-4 rounded-lg hover:bg-red-600 shadow-lg hover:shadow-xl transition duration-300 text-lg font-medium cursor-pointer"
        >
          Get Started
        </button>
      </div>

      <!-- right side -->
      <div class="md:w-1/2">
        <img src="./src/images/banner.png" alt="banner" class="w-full">
      </div>
    </section>

    <!-- script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
